<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImgSlider</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .slider {
            position: relative;
            width: 100%;
            overflow: hidden;
            height: 500px;
        }

        .slide{
            width: 70%;
            height: 100%;
            margin: auto;
        }

        .slider img {
            width: 100%;
            height: 100%;
            display: none;
        }

        img.displaySlide {
            display: block;
            animation: fade;
            animation-duration: 1.1s;
        }

        .slider button{
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            padding: 5px 15px;
            background-color: hsla(0, 0%, 0%, 0.5);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .prev{
            left: 0;
        }
        .next{
            right: 0;
        }
        @keyframes fade{
            from{opacity: .5;}
            to{opacity: 1;}
        }
    </style>
</head>

<body>
    <div class="slider">
        <div class="slide">
            <img class="slide" src="https://www.apple.com/v/home/images/back-to-school-2026/a/hero_back_to_school_startframe__cd4vg5frm39e_large_2x.png" alt="Image#1">
            <img class="slide" src="https://www.apple.com/v/home/images/iphone-family/a/hero_iphone_family__be5jkzxszb1e_large_2x.jpg" alt="Image#2">
            <img class="slide" src="https://www.apple.com/v/home/images/macbook-air-m5/a/hero_macbook_air_m5__eb1idggd120y_large_2x.jpg" alt="Image#3">
        </div>
        <button class="prev" onclick="prevSlide()">&#10094</button>
        <button class="next" onclick="nextSlide()">&#10095</button>
    </div>
    <script src="image-slider.js"></script>

</body>

</html>
